- name: Download and install Bitwarden CLI
  become: true
  vars:
    bw_tmp_dir: /tmp/bitwarden-cli
  block:
    - name: Ensure temporary download directory exists
      ansible.builtin.file:
        path: "{{ bw_tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Download latest Bitwarden CLI zip (stable redirect URL)
      ansible.builtin.get_url:
        url: "https://vault.bitwarden.com/download/?app=cli&platform=linux"
        dest: "{{ bw_tmp_dir }}/bw.zip"
        mode: "0644"
        force: true

    - name: Unzip Bitwarden CLI archive
      ansible.builtin.unarchive:
        src: "{{ bw_tmp_dir }}/bw.zip"
        dest: "{{ bw_tmp_dir }}"
        remote_src: true

    - name: Set execute permissions on bw binary
      ansible.builtin.file:
        path: "{{ bw_tmp_dir }}/bw"
        mode: "0755"

    - name: Move bw binary to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ bw_tmp_dir }}/bw"
        dest: /usr/local/bin/bw
        mode: "0755"
        remote_src: true

    - name: Clean up temporary download directory
      ansible.builtin.file:
        path: "{{ bw_tmp_dir }}"
        state: absent

- name: Build and install undistributed void linux packages
  vars:
    void_packages_repo: "https://github.com/void-linux/void-packages.git"
    void_packages_dest: "{{ repos_path }}/void-packages"
    target_packages:
      - google-chrome
      - brave-origin-bin
  block:
    - name: Clone/update void-packages to latest master
      ansible.builtin.git:
        repo: "{{ void_packages_repo }}"
        dest: "{{ void_packages_dest }}"
        depth: 1
        single_branch: true
        version: master
        force: true
      register: clone_result

    - name: Overlay custom srcpkgs (brave-origin-bin, etc.)
      ansible.builtin.copy:
        src: files/void/srcpkgs/
        dest: "{{ void_packages_dest }}/srcpkgs/"
        mode: preserve

    - name: Bootstrap the xbps-src build environment
      ansible.builtin.command: ./xbps-src binary-bootstrap
      args:
        chdir: "{{ void_packages_dest }}"
        creates: "{{ void_packages_dest }}/masterdir"

    - name: Enable restricted packages
      ansible.builtin.lineinfile:
        path: "{{ void_packages_dest }}/etc/conf"
        create: yes
        regexp: "^XBPS_ALLOW_RESTRICTED="
        line: "XBPS_ALLOW_RESTRICTED=yes"

    - name:
        Build each requested package with xbps-src (failures do not abort the
        play)
      ansible.builtin.command: ./xbps-src pkg {{ item }}
      args:
        chdir: "{{ void_packages_dest }}"
      environment:
        XBPS_ALLOW_RESTRICTED: "yes"
      loop: "{{ target_packages }}"
      loop_control:
        label: "{{ item }}"
      register: build_result
      failed_when: false

    - name: Determine which packages built successfully
      ansible.builtin.set_fact:
        built_packages: >-
          {{ build_result.results
             | selectattr('rc', 'equalto', 0)
             | map(attribute='item') | list }}
        failed_build_packages: >-
          {{ build_result.results
             | rejectattr('rc', 'equalto', 0)
             | map(attribute='item') | list }}

    - name: Warn about packages that failed to build
      ansible.builtin.debug:
        msg:
          "{{ item }} failed to build — skipping install. Check {{
          void_packages_dest }}/hostdir/binpkgs logs manually."
      loop: "{{ failed_build_packages }}"
      when: failed_build_packages | length > 0

    - name: Install successfully built packages from the local hostdir repo
      become: true
      ansible.builtin.command: >
        xbps-install --yes --repository={{ void_packages_dest }}/hostdir/binpkgs
        --repository={{ void_packages_dest }}/hostdir/binpkgs/nonfree {{
        built_packages | join(' ') }}
      register: install_result
      changed_when: "'Nothing to do' not in install_result.stdout"
      failed_when: false
      when: built_packages | length > 0

    - name: Report install outcome
      ansible.builtin.debug:
        msg: >-
          {{ 'Install failed (rc=' ~ install_result.rc ~ '): ' ~
          install_result.stderr
             if (install_result is defined and install_result.rc | default(0) !=
          0)
             else 'Install step completed.' }}
      when: built_packages | length > 0
