- name: Ensure common cli tools are installed (Void Linux)
  become: true
  community.general.xbps:
    state: present
    name:
      # ==========================================
      # Core System & Hardware
      # ==========================================
      - lsof
      - xdg-utils
      - android-tools
      - xtools
      - curl
      - piper

      # ==========================================
      # Audio & Multimedia Stack
      # ==========================================
      - pipewire
      - pavucontrol
      - mpd
      - mpc
      - ncmpcpp
      - mpv
      - yt-dlp

      # ==========================================
      # Modern CLI Upgrades (Rust/Go Alternatives)
      # ==========================================
      - bat
      - fd
      - ripgrep
      - fzf
      - bottom
      - fastfetch
      - tealdeer
      - dragon

      # ==========================================
      # General Terminal Utilities
      # ==========================================
      - tmux
      - tree
      - less
      - trash-cli
      - translate-shell
      - jq
      - xsv
      - hyperfine
      - ImageMagick
      - chafa

      # ==========================================
      # Development & Version Control
      # ==========================================
      - git
      - github-cli
      - lazygit
      - jujutsu
      - lazydocker
      - tree-sitter-cli

      # ==========================================
      # File Management, Sync & Downloading
      # ==========================================
      - lf
      - rsync
      - rclone
      - aria2
      - qbittorrent

      # ==========================================
      # Image & Document Viewers
      # ==========================================
      - feh
      - nsxiv
      - zathura
      - calibre
      - zathura-pdf-mupdf

      # ==========================================
      # Security & Dotfiles
      # ==========================================
      - gopass
      - oath-toolkit
      - pinentry-gtk
      - stow

      # ==========================================
      # Desktop Environment, Theming & Appearance
      # ==========================================
      - alacritty
      - rofi
      - dunst
      - gammastep
      - nwg-look
      - qt6ct
      - breeze-gtk
      - breeze-icons

      # ==========================================
      # Fonts
      # ==========================================
      - terminus-font
      - noto-fonts-cjk
      - noto-fonts-emoji
      - nerd-fonts-symbols-ttf

- name: Void Linux installation cleanup
  become: true
  community.general.xbps:
    state: absent
    name:
      - lvm2
      - mdadm
      - dialog
      - ansible
      - cryptsetup
      - ansible-lint
      - void-live-audio
      - void-docs-browse
      - python3-packaging
