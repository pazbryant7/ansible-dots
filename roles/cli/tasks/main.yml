- name: "Get distribution"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: "Run tasks for {{ host_os }}"
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup UV environment
  become: false
  vars:
    uv_tools_path: "{{ ansible_env.HOME }}/.local/share/uv/tools"
  block:
    - name: Install global CLI tools via uv
      ansible.builtin.shell:
        cmd: "uv tool install {{ tool_item }}"
        creates: "{{ uv_tools_path }}/{{ tool_item }}"
      loop:
        - names-generator
      loop_control:
        loop_var: tool_item

- name: Setup Rust environment
  become: false
  vars:
    rust_toolchain_path:
      "{{ ansible_env.HOME }}/.rustup/toolchains/stable-x86_64-unknown-linux-gnu"
  block:
    - name: Install stable toolchain
      ansible.builtin.command:
        cmd: rustup toolchain install stable
        creates: "{{ rust_toolchain_path }}"

    - name: Install rustup components
      ansible.builtin.command:
        cmd: "rustup component add {{ rust_item }}"
        creates: "{{ rust_toolchain_path }}/bin/{{ rust_item }}"
      loop:
        - rustfmt
        - rust-analyzer
      loop_control:
        loop_var: rust_item

    - name: Install packages using cargo
      community.general.cargo:
        name: "{{ cargo_item.name }}"
        state: present
        executable: /usr/sbin/cargo
        features: "{{ cargo_item.features | default(omit) }}"
      loop:
        - name: fnm
      loop_control:
        loop_var: cargo_item

- name: Setup fnm and Node.js
  vars:
    fnm_bin: "{{ ansible_env.HOME }}/.cargo/bin/fnm"
  block:
    - name: Verify fnm installation
      ansible.builtin.command: "{{ fnm_bin }} --version"
      register: fnm_version
      changed_when: false
      failed_when: fnm_version.rc != 0

    - name: Install latest LTS Node.js using fnm
      ansible.builtin.command: "{{ fnm_bin }} install --lts"
      register: fnm_install
      changed_when: "'already installed' not in fnm_install.stderr"

    - name: Set latest LTS as default version
      ansible.builtin.command: "{{ fnm_bin }} default lts-latest"
      changed_when: false
