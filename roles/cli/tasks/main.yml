- name: "Get distribution"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: "Run tasks for {{ host_os }}"
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup UV environment
  become: false
  block:
    - name: Install global CLI tools via uv
      ansible.builtin.shell:
        cmd: "uv tool install {{ tool_item }}"
        creates: "{{ ansible_env.HOME }}/.local/share/uv/tools/{{ tool_item }}"
      loop:
        - names-generator
      loop_control:
        loop_var: tool_item

- name: Setup Rust environment
  become: false
  block:
    - name: Install stable toolchain
      ansible.builtin.command:
        cmd: rustup toolchain install stable
        creates:
          "{{ ansible_env.HOME
          }}/.rustup/toolchains/stable-x86_64-unknown-linux-gnu"

    - name: Install rustup components
      ansible.builtin.command:
        cmd: "rustup component add {{ rust_item }}"
        creates:
          "{{ ansible_env.HOME
          }}/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/{{ rust_item
          }}"
      loop:
        - rustfmt
        - rust-analyzer
      loop_control:
        loop_var: rust_item

    - name: Install packages using cargo
      community.general.cargo:
        name: "{{ cargo_item.name }}"
        state: present
        executable: /usr/sbin/cargo
        features: "{{ cargo_item.features | default(omit) }}"
      loop:
        - name: fnm
        - name: himalaya
          features:
            - oauth2
      loop_control:
        loop_var: cargo_item
