- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Copy st-lf.desktop file to applications directory
  become: true
  ansible.builtin.copy:
    src: files/common/usr/share/applications/lf-st.desktop
    dest: /usr/share/applications/lf-st.desktop
    owner: root
    group: root
    mode: "0644"
