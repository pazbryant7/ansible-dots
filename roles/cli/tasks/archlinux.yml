- name: Ensure common cli tools are installed
  become: true
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - jq
    - go
    - uv
    - fd
    - xh
    - fzf
    - mpc
    - git
    - bat
    - xsv
    - mpv
    - eza
    - mpd
    - lua
    - stow
    - hurl
    - just
    - glow
    - sqlc
    - tmux
    - fish
    - tree
    - less
    - yazi
    - dust
    - lsof
    - 7zip
    - aria2
    - atuin
    - pgcli
    - rsync
    - qt6ct
    - yt-dlp
    - rustup
    - gopass
    - rclone
    - ffmpeg
    - zoxide
    - bottom
    - ncmpcpp
    - ripgrep
    - firefox
    - zathura
    - pcmanfm
    - jujutsu
    - poppler
    - calibre
    - img2pdf
    - starship
    - libpulse
    - nwg-look
    - luarocks
    - fastfetch
    - gammastep
    - alacritty
    - watchexec
    - bandwhich
    - syncthing
    - hyperfine
    - breeze-gtk
    - typescript
    - github-cli
    - difftastic
    - python-pip
    - streamlink
    - qutebrowser
    - qbittorrent
    - pavucontrol
    - imagemagick
    - breeze-icons
    - speedtest-cli
    - android-tools
    - pacman-contrib
    - translate-shell
    - zathura-pdf-mupdf
    - ffmpegthumbnailer
    - capitaine-cursors
    - perl-image-exiftool

- name: Install aur packages using paru
  kewlfft.aur.aur:
    use: paru
    name: "{{ item }}"
    state: present
  loop:
    - wego
    - ani-cli
    - bun-bin
    - datagrip
    - lazydocker
    - ventoy-bin
    - numbat-bin
    - dragon-drop
    - datagrip-jre
    - thorium-browser-bin
