- name: Setup dotfiles with stow
  become: false
  vars:
    stow_repo_url: "git@personal.github:pazbryant7/dotfiles.git"
  ansible.builtin.command:
    cmd: >
      stow --dir="{{ dotfiles_dir }}" --target="{{ ansible_user_dir }}" --adopt
      --restow .
  args:
    chdir: "{{ dotfiles_dir }}"
  register: stowstdr
  changed_when: stowstdr.rc != 0
