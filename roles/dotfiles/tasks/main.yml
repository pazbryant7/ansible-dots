- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Ensure clone dotfiles
  become: false
  ansible.builtin.git:
    repo: "git@personal.github:pazbryant7/dotfiles.git"
    dest: "{{ dots_path }}"
    version: main
    depth: 1
    update: false
    recursive: true
    accept_newhostkey: true

- name: Stow dotfiles (adopting conflicting system files)
  ansible.builtin.command:
    cmd:
      stow --dir="{{ dots_path }}" --target="{{ ansible_user_dir }}" --adopt
      --restow .
  args:
    chdir: "{{ dots_path }}"
  register: stow_result
  changed_when: false
  failed_when: stow_result.rc != 0

- name: Discard adopted system files so dotfiles repo versions win
  ansible.builtin.command:
    cmd: git restore .
  args:
    chdir: "{{ dots_path }}"
  register: git_result
  changed_when: false
