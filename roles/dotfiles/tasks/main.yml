- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Clone dotfiles repositories
  become: false
  ansible.builtin.git:
    repo: "git@personal.github:pazbryant7/{{ item }}.git"
    dest: "{{ repos_path }}/{{ item }}"
    version: main
    depth: 1
    update: false
    recursive: true
  loop:
    - nvim
    - dotfiles

- name: Stow dotfiles
  block:
    - name: Ensure base directories exist
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .config

    - name: Stow dotfiles without adopting conflicting files
      ansible.builtin.command:
        cmd:
          stow --dir="{{ dots_path }}" --target="{{ ansible_user_dir }}"
          --restow .
      args:
        chdir: "{{ dots_path }}"
      register: dotfiles_stow_result
      changed_when: false
      failed_when: dotfiles_stow_result.rc != 0
      when: not (dotfiles_adopt | bool)

    - name: Stow dotfiles while adopting conflicting files
      ansible.builtin.command:
        cmd:
          stow --dir="{{ dots_path }}" --target="{{ ansible_user_dir }}" --adopt
          --restow .
      args:
        chdir: "{{ dots_path }}"
      register: dotfiles_stow_adopt_result
      changed_when: false
      failed_when: dotfiles_stow_adopt_result.rc != 0
      when: dotfiles_adopt | bool

    - name: Restore dotfiles after explicitly adopting conflicting files # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: git restore .
      args:
        chdir: "{{ dots_path }}"
      register: dotfiles_git_restore_result
      changed_when: false
      when: dotfiles_adopt | bool

- name: Setup neovim
  block:
    - name: Check existing neovim configuration path
      become: false
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/nvim"
      register: dotfiles_nvim_dir_stat

    - name: Refuse to replace an existing Neovim configuration
      ansible.builtin.assert:
        that: >-
          not (dotfiles_nvim_dir_stat.stat.exists and not
          dotfiles_nvim_dir_stat.stat.islnk) or dotfiles_replace_existing_nvim |
          bool
        fail_msg: >-
          {{ ansible_user_dir }}/.config/nvim already exists. Set
          dotfiles_replace_existing_nvim=true only after backing it up.

    - name: Remove existing Neovim configuration after explicit opt-in
      become: false
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/nvim"
        state: absent
      when:
        dotfiles_nvim_dir_stat.stat.exists and not
        dotfiles_nvim_dir_stat.stat.islnk and dotfiles_replace_existing_nvim |
        bool

    - name: Symlink neovim configuration
      become: false
      ansible.builtin.file:
        src: "{{ repos_path }}/nvim"
        dest: "{{ ansible_user_dir }}/.config/nvim"
        state: link
        force: "{{ dotfiles_replace_existing_nvim | bool }}"

    - name: Copy nvim.desktop file to applications directory
      become: true
      ansible.builtin.copy:
        src: files/common/usr/share/applications/nvim.desktop
        dest: /usr/share/applications/nvim.desktop
        owner: root
        group: root
        mode: "0644"

- name: Update ansible-dots remote
  block:
    - name: Get current origin remote URL # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: git remote get-url origin
      args:
        chdir: "{{ playbook_dir }}"
      register: dotfiles_origin_url
      changed_when: false
      failed_when: dotfiles_origin_url.rc != 0

    - name: Set origin remote to use SSH (work.github) # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          git remote set-url origin {{ dotfiles_origin_url.stdout |
          regex_replace('^https://github\.com/', 'git@work.github:') }}
      args:
        chdir: "{{ playbook_dir }}"
      when: dotfiles_origin_url.stdout is match('^https://github\.com/')
      changed_when: true
