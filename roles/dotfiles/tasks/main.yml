- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Ensure clone dotfiles
  become: false
  vars:
    dotfiles_repo: "git@personal.github:pazbryant7/dotfiles.git"
  ansible.builtin.git:
    update: false
    version: main
    recursive: true
    accept_newhostkey: true
    dest: "{{ dotfiles_dir }}"
    repo: "{{ dotfiles_repo }}"
  changed_when: true

- name: Stow dotfiles (adopting conflicting system files)
  ansible.builtin.command:
    cmd: stow --dir="{{ dotfiles_dir }}" --target="{{ ansible_user_dir }}" --adopt --restow .
  args:
    chdir: "{{ dotfiles_dir }}"
  register: stow_result
  changed_when: false
  failed_when: stow_result.rc != 0

- name: Discard adopted system files so dotfiles repo versions win
  ansible.builtin.command:
    cmd: git restore .
  args:
    chdir: "{{ dotfiles_dir }}"
  register: git_result
  changed_when: false
