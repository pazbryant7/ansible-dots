- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Manage Main GPG Key
  become: false
  vars:
    dir: "{{ ansible_user_dir }}/.gnupg"
    key: "{{ playbook_dir }}/.secrets/gpg/private-key.asc"
  block:
    - name: Ensure gpg directory exists
      ansible.builtin.file:
        path: "{{ dir }}"
        state: directory
        mode: "0700"
        owner: "{{ host_user }}"
        group: "{{ host_user }}"

    - name: Check if private key file exists
      ansible.builtin.stat:
        path: "{{ key }}"
      register: gpg_key_file
      no_log: true

    - name: Import and trust main private key
      when: gpg_key_file.stat.exists
      block:
        - name: Import private key into keyring
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --import
              - "{{ key }}"
          register: gpg_imported_key
          changed_when: "'secret key imported' in gpg_imported_key.stderr"
          no_log: true

        - name: Read main GPG key details
          ansible.builtin.command:
            argv:
              - gpg
              - --with-colons
              - --show-keys
              - "{{ key }}"
          register: gpg_key_details
          changed_when: false
          no_log: true

        - name: Get main GPG key fingerprint
          ansible.builtin.set_fact:
            gpg_fingerprint: >-
              {{
                (
                  gpg_key_details.stdout_lines
                  | select('match', '^fpr:')
                  | map('split', ':')
                  | map(attribute=9)
                  | list
                  | first
                ) | default('')
              }}
          no_log: true

        - name: Set ultimate trust on main GPG key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --import-ownertrust
            stdin: "{{ gpg_fingerprint }}:6:"
          changed_when: false
          no_log: true
          when: gpg_fingerprint | length > 0
