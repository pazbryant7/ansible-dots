- name: Ensure clone github repositories
  become: false
  ansible.builtin.git:
    repo: "git@personal.github:pazbryant7/{{ item }}.git"
    dest: "{{ repos_path }}/{{ item }}"
    version: main
    depth: 1
    update: false
    recursive: true
    clone: true
    single_branch: true
    accept_hostkey: true
  loop:
    - pass
    - nvim
    - media
    - notes
    - youtube
    - leetcode
    - portfolio
    - pass-backup
    - boilerplate

- name: "Update ansible-dots remote"
  block:
    - name: Get current origin remote URL
      ansible.builtin.command:
        cmd: git remote get-url origin
        chdir: "{{ repos_path }}/ansible-dots"
      register: origin_url
      changed_when: false
      failed_when: origin_url.rc != 0

    - name: Set origin remote to use SSH (work.github)
      ansible.builtin.command:
        cmd: >-
          git remote set-url origin {{ origin_url.stdout
             | regex_replace('^https://github\.com/', 'git@work.github:') }}
      chdir: "{{ repos_path }}/ansible-dots"
      when: origin_url.stdout is match('^https://github\.com/')

- name: "Setup neovim"
  block:
    - name: Check existing neovim configuration path
      become: false
      ansible.builtin.stat:
        path: "{{ xdg_path }}/nvim"
      register: nvim_dir_stat

    - name: Remove neovim config folder if it exists as a standard directory
      become: false
      ansible.builtin.file:
        path: "{{ xdg_path }}/nvim"
        state: absent
      when:
        nvim_dir_stat.stat.exists and nvim_dir_stat.stat.isdir and not
        nvim_dir_stat.stat.islnk

    - name: Symlink neovim configuration
      become: false
      ansible.builtin.file:
        src: "{{ repos_path }}/nvim"
        dest: "{{ xdg_path }}/nvim"
        state: link
        force: true

    - name: Copy nvim.desktop file to applications directory
      become: true
      ansible.builtin.copy:
        src: files/common/nvim.desktop
        dest: "/usr/share/applications/nvim.desktop"
        owner: root
        group: root
        mode: "0644"
