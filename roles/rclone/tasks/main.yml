- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup rclone
  vars:
    rclone_config_dir: "{{ ansible_env.HOME }}/.config/rclone"
    rclone_secret_src: ".secrets/xdg_config/rclone/rclone.conf"
  block:
    - name: Ensure rclone config directory exists
      ansible.builtin.file:
        path: "{{ rclone_config_dir }}"
        state: directory
        mode: "0700"

    - name: Deploy rclone configuration
      ansible.builtin.copy:
        dest: "{{ rclone_config_dir }}/rclone.conf"
        mode: "0600"
        content: "{{ lookup('file', rclone_secret_src) }}"
        force: false
