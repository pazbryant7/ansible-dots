- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup rclone
  become: false
  vars:
    dir: "{{ xdg_path }}/rclone"
    config_file: ".secrets/xdg_config/rclone/rclone.conf"
  block:
    - name: Ensure rclone config directory exists
      ansible.builtin.file:
        path: "{{ dir }}"
        state: directory
        mode: "0700"

    - name: Deploy rclone configuration
      ansible.builtin.copy:
        dest: "{{ dir }}/rclone.conf"
        mode: "0600"
        content: "{{ lookup('file', config_file) }}"
        force: false
