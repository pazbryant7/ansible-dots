- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Check whether GRUB is configured
  become: true
  ansible.builtin.stat:
    path: /etc/default/grub
  register: system_grub_conf_file

- name: Setup Grub
  become: true
  when:
    - manage_grub | bool
    - system_grub_conf_file.stat.exists
  vars:
    grub_conf: /etc/default/grub
    grub_cfg: /boot/grub/grub.cfg
  block:
    - name: Ensure GRUB_DEFAULT is set to saved
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^GRUB_DEFAULT="
        line: "GRUB_DEFAULT=saved"
        backup: true
      register: system_grub_default

    - name: Ensure GRUB_SAVEDEFAULT is enabled
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^#?GRUB_SAVEDEFAULT="
        line: "GRUB_SAVEDEFAULT=true"
        backup: true
      register: system_grub_savedefault

    - name: Ensure GRUB_DISABLE_SUBMENU is enabled
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^#?GRUB_DISABLE_SUBMENU="
        line: "GRUB_DISABLE_SUBMENU=y"
        backup: true
      register: system_grub_submenu

    - name: Regenerate GRUB configuration
      ansible.builtin.command: grub-mkconfig -o "{{ grub_cfg }}"
      when:
        system_grub_default.changed or system_grub_savedefault.changed or
        system_grub_submenu.changed
      register: system_grub_result
      failed_when: system_grub_result.rc != 0
      changed_when: true
