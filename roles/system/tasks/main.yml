- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Ensure user local bin directory exists
  become: true
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Configure timezone and NTP
  become: true
  when: systemd_status.rc == 0
  block:
    - name: Set timezone to America/Merida
      community.general.timezone:
        name: America/Merida

    - name: Enable NTP synchronization
      ansible.builtin.command: timedatectl set-ntp true
      register: ntp_result
      changed_when: ntp_result.rc == 0

- name: Setup consolefont and keymap mkinitcpio.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: '^HOOKS=\((?!.*keymap)(?!.*consolefont)(.*)\)'
    line: 'HOOKS=(\1 keymap consolefont)'
    backrefs: true
  notify: Regenerate mkinitcpio binary image

- name: Flush DNS cache (systemd-resolved)
  become: true
  ansible.builtin.command:
    cmd: systemd-resolve --flush-caches
  changed_when: false
  when: systemd_status.rc == 0

- name: Configure GRUB defaults
  become: true
  vars:
    grub_conf: /etc/default/grub
    grub_cfg: /boot/grub/grub.cfg
  block:
    - name: Ensure GRUB_DEFAULT is set to saved
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^GRUB_DEFAULT="
        line: "GRUB_DEFAULT=saved"
        backup: true

    - name: Ensure GRUB_SAVEDEFAULT is enabled
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^#?GRUB_SAVEDEFAULT="
        line: "GRUB_SAVEDEFAULT=true"
        backup: true

    - name: Ensure GRUB_DISABLE_SUBMENU is enabled
      ansible.builtin.lineinfile:
        path: "{{ grub_conf }}"
        regexp: "^#?GRUB_DISABLE_SUBMENU="
        line: "GRUB_DISABLE_SUBMENU=y"
        backup: true

    - name: Regenerate GRUB configuration
      ansible.builtin.command: grub-mkconfig -o "{{ grub_cfg }}"
      register: grub_result
      changed_when: grub_result.rc == 0
      failed_when:
        - grub_result.rc != 0
        - "'overlay' not in grub_result.stderr"
