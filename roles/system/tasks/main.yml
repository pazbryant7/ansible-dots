- name: "Get distribution"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: "Run tasks for {{ host_os }}"
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Ensure user local bin directory exist
  become: true
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Configure timezone and NTP
  become: true
  block:
    - name: Set timezone to America/Merida
      community.general.timezone:
        name: America/Merida

    - name: Enable NTP synchronization
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false

- name: Configure restricted sites
  become: true
  ansible.builtin.copy:
    src: files/archlinux/etc/hosts
    dest: "/etc/hosts"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Flush DNS cache (systemd-resolved)
  become: true
  ansible.builtin.command:
    cmd: systemd-resolve --flush-caches
  changed_when: false

- name: Configure GRUB defaults
  become: true
  block:
    - name: Ensure GRUB_DEFAULT is set to 'saved'
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_DEFAULT="
        line: "GRUB_DEFAULT=saved"
        backup: true

    - name: Ensure GRUB_SAVEDEFAULT is enabled
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^#?GRUB_SAVEDEFAULT="
        line: "GRUB_SAVEDEFAULT=true"
        backup: true

    - name: Ensure GRUB_DISABLE_SUBMENU is enabled
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^#?GRUB_DISABLE_SUBMENU="
        line: "GRUB_DISABLE_SUBMENU=y"
        backup: true

    - name: Regenerate GRUB configuration
      ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
      register: grub_gen
      changed_when: grub_gen.rc == 0
