- name: Ensure pacman hooks directory exists
  become: true
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: "0755"

- name: Install pacman update hook
  become: true
  ansible.builtin.copy:
    src: files/archlinux/etc/pacman.d/hooks/update-apps.hook
    dest: /etc/pacman.d/hooks/update-apps.hook
    mode: "0644"
    force: false

- name: Enable pacman ParallelDownloads
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?ParallelDownloads\s*='
    line: "ParallelDownloads = 5"
    backup: true
