- name: Install hardware (GPU/CPU) drivers on Void Linux
  vars:
    drivers_gpu_driver_map:
      intel:
        packages:
          - mesa-dri
          - libglvnd
          - mesa-vulkan-intel
          - intel-media-driver
      amd:
        packages:
          - mesa-dri
          - libglvnd
          - mesa-vulkan-radeon
      nvidia:
        packages:
          - nvidia
          - nvidia-libs-32bit
    drivers_cpu_microcode_map:
      intel: intel-ucode
      amd: linux-firmware-amd
  become: true
  block:
    - name: Ensure pciutils is installed for GPU detection
      community.general.xbps:
        name: pciutils
        state: present

    - name: Read PCI device info (GPU detection)
      ansible.builtin.command: lspci -k
      register: drivers_lspci_output
      changed_when: false

    - name: Determine GPU vendor from lspci output
      ansible.builtin.set_fact:
        drivers_gpu_vendor: >-
          {{
            'intel'
            if 'VGA compatible controller: Intel' in drivers_lspci_output.stdout
            or '3D controller: Intel' in drivers_lspci_output.stdout
            else 'nvidia'
            if 'VGA compatible controller: NVIDIA' in
          drivers_lspci_output.stdout
            or '3D controller: NVIDIA' in drivers_lspci_output.stdout
            else 'amd'
            if 'VGA compatible controller: Advanced Micro Devices' in
          drivers_lspci_output.stdout
            or '3D controller: Advanced Micro Devices' in
          drivers_lspci_output.stdout
            else 'unknown'
          }}

    - name: Fail early if GPU vendor is unrecognized
      ansible.builtin.fail:
        msg: >-
          Could not determine GPU vendor automatically from `lspci -k`. Please
          install the appropriate mesa/nvidia packages manually.
      when: drivers_gpu_vendor == 'unknown'

    - name: Determine CPU vendor from gathered facts
      ansible.builtin.set_fact:
        drivers_cpu_vendor: >-
          {{
            'intel'
            if 'GenuineIntel' in (ansible_facts.processor | join(' '))
            else 'amd'
            if 'AuthenticAMD' in (ansible_facts.processor | join(' '))
            else 'unknown'
          }}

    - name: Report detected hardware
      ansible.builtin.debug:
        msg:
          "Detected GPU vendor: {{ drivers_gpu_vendor }} | Detected CPU vendor:
          {{ drivers_cpu_vendor }}"

    - name: Install GPU driver packages
      community.general.xbps:
        name: "{{ drivers_gpu_driver_map[drivers_gpu_vendor].packages }}"
        state: present
        update_cache: true

    - name: Install CPU microcode package
      community.general.xbps:
        name: "{{ drivers_cpu_microcode_map[drivers_cpu_vendor] }}"
        state: present
      when: drivers_cpu_vendor in drivers_cpu_microcode_map
      notify: Regenerate initramfs for microcode (void)

    - name:
        Ensure target user is in the video group (required for /dev/dri access)
      ansible.builtin.user:
        name:
          "{{ target_user | default(ansible_env.SUDO_USER) |
          default(ansible_user_id) }}"
        groups: video
        append: true
      register: drivers_video_group_result

    - name: Remind about re-login if group membership changed # noqa no-handler
      ansible.builtin.debug:
        msg: >-
          User was just added to the 'video' group — log out/in (or reboot) for
          this to take effect.
      when: drivers_video_group_result.changed
