- name: Update bootloader config for microcode (artix)
  become: true
  ansible.builtin.command:
    cmd: grub-mkconfig -o /boot/grub/grub.cfg

- name: Regenerate initramfs for microcode (void)
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      for pkg in $(xbps-query -l | awk '{print $2}' | grep -E '^linux[0-9]+\.[0-9]+-[0-9]'); do
        kern=$(echo "$pkg" | sed -E 's/-[^-]+$//')
        echo "Reconfiguring $kern to pick up new microcode..."
        xbps-reconfigure -f "$kern"
      done
  register: reconf_result
  changed_when: "'Reconfiguring' in reconf_result.stdout"
