- name: Ensure NetworkManager is installed (Arch Linux)
  become: true
  ansible.builtin.pacman:
    name: networkmanager
    state: present
    update_cache: true

- name: Ensure NetworkManager is running and enabled
  become: true
  ansible.builtin.service:
    name: NetworkManager
    state: started
    enabled: true

- name: Set DNS variables
  ansible.builtin.set_fact:
    primary_dns: "1.1.1.1 1.0.0.1" # Cloudflare
    fallback_dns: "9.9.9.9 149.112.112.112" # Quad9

- name: Configure DNS for NetworkManager (Cloudflare + Quad9)
  become: true
  block:
    - name: Detect active NetworkManager connection
      ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
      register: nm_active
      changed_when: false

    - name: Extract first active connection name
      ansible.builtin.set_fact:
        nm_connection_name: "{{ nm_active.stdout_lines[0].split(':')[0] | default('') }}"

    - name: Fail if no active NetworkManager connection found
      ansible.builtin.fail:
        msg: "No active NetworkManager connection detected."
      when: nm_connection_name == ""

    - name: Configure Cloudflare and Quad9 DNS servers
      ansible.builtin.command: >
        nmcli connection modify "{{ nm_connection_name }}"
        ipv4.dns "{{ primary_dns }} {{ fallback_dns }}"
        ipv4.ignore-auto-dns yes
      register: nm_modify
      changed_when: nm_modify.rc == 0

    - name: Bring connection up to apply DNS changes
      ansible.builtin.command: nmcli connection up "{{ nm_connection_name }}"
      register: nm_up
      changed_when: nm_up.rc == 0

    - name: Verify DNS settings
      ansible.builtin.command: >
        nmcli -f GENERAL.NAME,IP4.DNS connection show "{{ nm_connection_name }}"
      register: nm_dns_check
      changed_when: false
      failed_when: nm_dns_check.rc != 0

    - name: Show current DNS configuration
      ansible.builtin.debug:
        var: nm_dns_check.stdout
