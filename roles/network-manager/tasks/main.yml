- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Ensure NetworkManager is installed
  become: true
  community.general.pacman:
    name: networkmanager
    state: present
    update_cache: true

- name: Ensure NetworkManager is running and enabled
  become: true
  ansible.builtin.systemd:
    name: NetworkManager.service
    state: started
    enabled: true
  when: systemd_status.rc == 0

- name: Configure DNS for NetworkManager (Cloudflare + Quad9)
  become: true
  when: systemd_status.rc == 0
  block:
    - name: Detect active NetworkManager connection
      ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
      register: nm_active
      changed_when: false

    - name: Extract first active connection name
      ansible.builtin.set_fact:
        nm_connection_name:
          "{{ nm_active.stdout_lines[0].split(':')[0] | default('') }}"

    - name: Fail if no active NetworkManager connection found
      ansible.builtin.fail:
        msg: "No active NetworkManager connection detected."
      when: nm_connection_name == ""

    - name: Check current DNS settings
      ansible.builtin.command: >
        nmcli -g ipv4.dns connection show "{{ nm_connection_name }}"
      register: nm_current_dns
      changed_when: false

    - name: Configure Cloudflare and Quad9 DNS servers
      ansible.builtin.command: >
        nmcli connection modify "{{ nm_connection_name }}" ipv4.dns "{{
        (dns_primary + dns_fallback) | join(' ') }}" ipv4.ignore-auto-dns yes
      when: >
        (dns_primary + dns_fallback) | difference(nm_current_dns.stdout.split())
        | length > 0
      notify: Bring up NetworkManager connection

    - name: Flush handlers to apply DNS changes immediately
      ansible.builtin.meta: flush_handlers
