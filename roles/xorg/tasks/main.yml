- name: Load OS-specific tasks if available
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Include OS-specific tasks
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup custom system configurations
  vars:
    files_base: files/common
    fonts_dest: "{{ ansible_user_dir }}/.local/share/fonts"
    system_files:
      - path: /etc
        files:
          - environment
      - path: /etc/X11/xorg.conf.d
        files:
          - 00-keyboard.conf
      - path: /usr/share/X11/xkb/symbols
        files:
          - bryantq
          - bryantqi
          - bryantqinv
          - bryantqinvi
      - path: /usr/share/kbd/keymaps/i386/qwerty
        files:
          - bryantq.map.gz
          - bryantqi.map.gz
          - bryantqinv.map.gz
          - bryantqinvi.map.gz
    obsolete_system_files:
      - /usr/share/X11/xkb/symbols/bryantqc
      - /usr/share/X11/xkb/symbols/bryantqic
      - /usr/share/X11/xkb/symbols/bryantd
      - /usr/share/X11/xkb/symbols/bryantdi
      - /usr/share/X11/xkb/symbols/bryantdc
      - /usr/share/X11/xkb/symbols/bryantdic
      - /usr/share/kbd/keymaps/i386/qwerty/bryantqc.map.gz
      - /usr/share/kbd/keymaps/i386/qwerty/bryantqic.map.gz
      - /usr/share/kbd/keymaps/i386/dvorak/bryantd.map.gz
      - /usr/share/kbd/keymaps/i386/dvorak/bryantdc.map.gz
      - /usr/share/kbd/keymaps/i386/dvorak/bryantdic.map.gz
  block:
    - name: Setup personal fonts
      become: false
      block:
        - name: Ensure user font directory exists
          ansible.builtin.file:
            path: "{{ fonts_dest }}/bryant-fonts"
            state: directory
            mode: "0755"

        - name: Deploy personal fonts
          ansible.builtin.copy:
            src: "{{ files_base }}/.local/share/fonts/"
            dest: "{{ fonts_dest }}"
            mode: "0644"
          register: font_deployment

        - name: Refresh user font cache
          ansible.builtin.command: fc-cache -f -v
          when: font_deployment.changed

    - name: Setup system-wide configurations
      become: true
      block:
        - name: Ensure system directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /usr/share/X11/xkb/symbols
            - /etc/X11/xorg.conf.d
            - /usr/share/kbd/keymaps/i386/qwerty

        - name: Deploy system configuration files
          ansible.builtin.copy:
            src: "{{ files_base }}{{ item.0.path }}/{{ item.1 }}"
            dest: "{{ item.0.path }}/{{ item.1 }}"
            mode: "0644"
          loop: "{{ system_files | subelements('files') }}"
          loop_control:
            label: "{{ item.0.path }}/{{ item.1 }}"

        - name: Remove obsolete custom keyboard layouts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ obsolete_system_files }}"
