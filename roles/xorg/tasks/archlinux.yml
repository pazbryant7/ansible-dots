- name: Setup Xorg environment
  become: true
  block:
    - name: Install required Xorg packages
      community.general.pacman:
        name:
          - feh
          - rofi
          - maim
          - picom
          - nsxiv
          - xcolor
          - xdotool
          - xorg-xev
          - screenkey
          - unclutter
          - xorg-xinit
          - ueberzugpp
          - xorg-server
          - xorg-xrandr
          - xorg-xsetroot
          - xorg-server-xephyr
        state: present

    - name: Remove Wayland-related packages
      community.general.pacman:
        name: waybar
        state: absent

- name: Setup custom system configurations
  become: true
  block:
    - name: Ensure system directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/udev/rules.d
        - /etc/X11/xorg.conf.d
        - /usr/share/fonts/bryant-fonts
        - /usr/share/kbd/keymaps

    - name: Deploy personal fonts
      ansible.builtin.copy:
        src: files/archlinux/usr/share/fonts/bryant-fonts/
        dest: /usr/share/fonts/bryant-fonts/
        owner: root
        group: root
        mode: "0755"
        force: false

    - name: Install vconsole keyboard map
      ansible.builtin.copy:
        src: files/archlinux/usr/share/kbd/keymaps/bryantd.map
        dest: /usr/share/kbd/keymaps/bryantd.map
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Deploy X11 custom keyboard layouts
      ansible.builtin.copy:
        src: files/archlinux/usr/share/X11/xkb/symbols/
        dest: /usr/share/X11/xkb/symbols/
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Deploy system environment file
      ansible.builtin.copy:
        src: files/archlinux/etc/environment
        dest: /etc/environment
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f -v
      register: fontcache
      changed_when: false
      failed_when: fontcache.rc != 0

    - name: Deploy X11 keyboard configuration
      ansible.builtin.copy:
        src: files/archlinux/etc/X11/xorg.conf.d/00-keyboard.conf
        dest: /etc/X11/xorg.conf.d/00-keyboard.conf
        mode: "0644"
        force: true

    - name: Deploy vconsole configuration
      ansible.builtin.copy:
        src: files/archlinux/etc/vconsole.conf
        dest: /etc/vconsole.conf
        mode: "0644"
        force: true
