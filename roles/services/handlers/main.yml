- name: restart nix-daemon
  become: true
  ansible.builtin.command: >-
    sv restart
    {{ '/run/runit/service/nix' if host_os == 'artixlinux'
    else '/var/service/nix-daemon' }}
  listen: "restart nix-daemon"

- name: restart runit services
  become: true
  ansible.builtin.command: "sv restart {{ runit_service_dir }}/{{ item }}"
  loop: "{{ runit_restart_services | default([]) }}"
  listen: "restart runit services"
