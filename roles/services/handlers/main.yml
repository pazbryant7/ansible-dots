- name: Restart Nix daemon through systemd
  become: true
  ansible.builtin.systemd_service:
    name: nix-daemon.service
    state: restarted
  when: host_os == 'archlinux'
  listen: restart nix-daemon

- name: Restart Nix daemon through runit
  become: true
  ansible.builtin.command: sv restart /var/service/nix-daemon
  when: host_os == 'void'
  listen: restart nix-daemon
  changed_when: true
