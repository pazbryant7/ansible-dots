- name: Ensure packages are installed via xbps
  become: true
  community.general.xbps:
    name:
      - cronie
      - chrony
      - elogind
      - socklog-void
    state: present

- name: Enable system services via runit
  become: true
  ansible.builtin.file:
    src: "/etc/sv/{{ item }}"
    dest: "/var/service/{{ item }}"
    state: link
  loop:
    - dbus
    - cronie
    - elogind
    - chronyd
    - nanoklogd
    - socklog-unix

- name: Add current user to socklog group
  become: true
  ansible.builtin.user:
    name: "{{ host_user }}"
    groups: socklog
    append: true
