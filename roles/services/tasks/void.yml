- name: Void services
  vars:
    runit_service_dir: /var/service
    runit_services:
      - dbus
      - cronie
      - docker
      - elogind
      - chronyd
      - nanoklogd
      - nix-daemon
      - socklog-unix
  block:
    - name: Ensure packages are installed via xbps
      become: true
      community.general.xbps:
        name:
          - ufw
          - nix
          - dbus
          - cronie
          - chrony
          - docker
          - elogind
          - socklog-void
          - docker-buildx
        state: present

    - name: Enable system services via runit
      become: true
      ansible.builtin.file:
        src: "/etc/sv/{{ item }}"
        dest: "{{ runit_service_dir }}/{{ item }}"
        state: link
      loop: "{{ runit_services }}"

    - name: Ensure system services are running through runit
      become: true
      ansible.builtin.command: "sv up {{ runit_service_dir }}/{{ item }}"
      changed_when: false
      loop: "{{ runit_services }}"

    - name: Add current user to socklog group
      become: true
      ansible.builtin.user:
        name: "{{ host_user }}"
        groups: socklog
        append: true
