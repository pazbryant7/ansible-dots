- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Copy script to the target system
  become: true
  ansible.builtin.copy:
    src: "files/common/backup-notes"
    dest: "/usr/local/bin/backup-notes"
    owner: root
    group: root
    mode: "0755"

- name: Configure repositories for backup-notes
  become: true
  ansible.builtin.copy:
    content: |
      # One absolute repository path per line. Blank lines and comments are ignored.
      {{ backup_notes_repositories | join('\n') }}
    dest: /etc/backup-notes.conf
    owner: root
    group: root
    mode: "0644"

- name: Set up Nix
  vars:
    stable: "github:NixOS/nixpkgs/nixos-26.05"
    unstable: "github:NixOS/nixpkgs/nixos-unstable"
    pkgs:
      - "pazbryant7/st"
      - "pazbryant7/dwm"
      - "pazbryant7/slstatus"
  environment:
    NIX_REMOTE: daemon
  block:
    - name: Enable experimental features
      become: true
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        line: "experimental-features = nix-command flakes"
        create: true
        mode: "0644"
      notify: "restart nix-daemon"

    - name: Pin unstable (default for bare nixpkgs#)
      ansible.builtin.command: "nix registry add nixpkgs {{ unstable }}"
      changed_when: false

    - name: Pin stable
      ansible.builtin.command: "nix registry add nixpkgs-stable {{ stable }}"
      changed_when: false

    - name: Get installed Nix profile packages
      ansible.builtin.command: nix profile list --json
      register: services_installed_profiles
      changed_when: false

    - name: Collect installed Nix profile elements
      ansible.builtin.set_fact:
        services_installed_profile_elements: >-
          {{ (services_installed_profiles.stdout | from_json).elements |
          default({}) }}

    - name: Install flakes
      ansible.builtin.command: "nix profile add --refresh github:{{ item }}"
      loop: "{{ pkgs }}"
      when: item not in services_installed_profile_elements
      changed_when: true

    - name: Install Nix packages (no special flags needed)
      ansible.builtin.command: "nix profile add nixpkgs#{{ item }}"
      loop:
        - opencode
        - brave-origin
        - bitwarden-cli
      when: item not in services_installed_profile_elements
      changed_when: true

    - name: Install Ventoy (unfree + insecure)
      ansible.builtin.command: "nix profile add nixpkgs#{{ item }} --impure"
      loop:
        - ventoy
      when:
        - install_ventoy | bool
        - item not in services_installed_profile_elements
      environment:
        NIXPKGS_ALLOW_UNFREE: "1"
        NIXPKGS_ALLOW_INSECURE: "1"
      changed_when: true

- name: Create hourly cron task for the regular user
  ansible.builtin.cron:
    name: "Execute backup-notes once per hour"
    minute: "0"
    hour: "*"
    day: "*"
    month: "*"
    weekday: "*"
    user: "{{ host_user }}"
    job: "/usr/local/bin/backup-notes"

- name: Setup docker group
  become: true
  when: manage_docker_group | bool
  block:
    - name: Ensure the docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure the user is in the docker group
      ansible.builtin.user:
        name: "{{ host_user }}"
        groups: docker
        append: true

- name: Configure UFW firewall
  become: true
  block:
    - name: Allow UFW forwarding for Docker
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_FORWARD_POLICY="
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

    - name: Set default policies
      community.general.ufw:
        direction: "{{ ufw_item.direction }}"
        default: "{{ ufw_item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }
      loop_control:
        loop_var: ufw_item

    - name: Allow LAN access
      community.general.ufw:
        rule: allow
        from_ip: "{{ ufw_lan_cidr }}"

    - name: Allow Docker networks
      community.general.ufw:
        rule: allow
        from_ip: "{{ ufw_docker_cidr }}"

    - name: Allow Deluge (Incoming default ports)
      community.general.ufw:
        rule: allow
        port: "58846"
        proto: tcp

    - name: Allow qBittorrent (Incoming default BT ports)
      community.general.ufw:
        rule: allow
        port: "6881"
        proto: any

    - name: Limit SSH brute-force attempts
      community.general.ufw:
        rule: limit
        port: "{{ ufw_ssh_port }}"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Start UFW after its rules are configured on Arch Linux
  become: true
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
    state: started
  when: host_os == 'archlinux'

- name: Enable UFW after its rules are configured on Void Linux
  become: true
  ansible.builtin.file:
    src: /etc/sv/ufw
    dest: /var/service/ufw
    state: link
  when: host_os == 'void'
