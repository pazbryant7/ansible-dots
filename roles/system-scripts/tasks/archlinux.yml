- name: Deploy system scripts to sudo PATH
  become: true
  vars:
    dest_dir: "/usr/local/bin"
    src_pattern: "archlinux/usr/local/bin/*"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ dest_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0755"
  with_fileglob:
    - "{{ src_pattern }}"
