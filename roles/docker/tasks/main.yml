- name: Get distribution
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ host_os }}.yml"
  register: distribution_config

- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"
  when: distribution_config.stat.exists

- name: Setup docker group
  become: true
  block:
    - name: Ensure the docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure the user is in the docker group
      ansible.builtin.user:
        name: "{{ host_user }}"
        groups: docker
        append: true

- name: Configure Docker (On-Demand)
  become: true
  block:
    - name: Ensure docker.service is disabled and stopped
      ansible.builtin.systemd:
        name: docker.service
        enabled: false
        state: stopped

    - name: Enable and start docker.socket
      ansible.builtin.systemd:
        name: docker.socket
        enabled: true
        state: started
        daemon_reload: true
  when: systemd_status.rc == 0
