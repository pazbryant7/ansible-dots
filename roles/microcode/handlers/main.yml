- name: Regenerate initramfs for microcode (arch)
  become: true
  block:
    - name: Regenerate mkinitcpio
      ansible.builtin.command:
        cmd: mkinitcpio -P
      register: mkinitcpio_result
      changed_when: true

    - name: Regenerate GRUB config (only if GRUB is installed)
      become: true
      ansible.builtin.shell:
        cmd: |
          if command -v grub-mkconfig >/dev/null 2>&1 && [ -d /boot/grub ]; then
            grub-mkconfig -o /boot/grub/grub.cfg
            echo CHANGED
          else
            echo "GRUB not detected, skipping"
          fi
      register: grub_result
      changed_when: "'CHANGED' in grub_result.stdout"

- name: Regenerate initramfs for microcode (void)
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      for pkg in $(xbps-query -l | awk '{print $2}' | grep -E '^linux[0-9]+\.[0-9]+-[0-9]'); do
        kern=$(echo "$pkg" | sed -E 's/-[^-]+$//')
        echo "Reconfiguring $kern to pick up new microcode..."
        xbps-reconfigure -f "$kern"
      done
  register: reconf_result
  changed_when: "'Reconfiguring' in reconf_result.stdout"
