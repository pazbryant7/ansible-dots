- name: Setup Bob and Neovim
  vars:
    applications_dir: /usr/share/applications
    nvim_bin_path: "{{ ansible_env.HOME }}/.local/share/bob/nvim-bin/nvim"
  block:
    - name: Install Bob (Neovim version manager)
      become: true
      community.general.pacman:
        name: bob
        state: present

    - name: Verify Bob installation
      become: false
      ansible.builtin.command: bob --version
      register: bob_version
      changed_when: false
      failed_when: bob_version.rc != 0

    - name: Install and activate latest stable Neovim using Bob
      become: false
      ansible.builtin.command: bob use stable
      register: bob_use
      # Bob prints "Already using stable" when nothing changed
      changed_when: "'Already using' not in bob_use.stdout"

    - name: Symlink Neovim configuration
      ansible.builtin.file:
        src: "{{ github_dir }}/nvim"
        dest: "{{ ansible_user_dir }}/.config/nvim"
        state: link
        force: true

    - name: Ensure applications directory exists
      become: true
      ansible.builtin.file:
        path: "{{ applications_dir }}"
        state: directory
        mode: "0755"

    - name: Copy nvim.desktop file to applications directory
      become: true
      ansible.builtin.copy:
        src: files/nvim.desktop
        dest: "{{ applications_dir }}/nvim.desktop"
        owner: root
        group: root
        mode: "0644"
