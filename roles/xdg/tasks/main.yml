- name: Run tasks for {{ host_os }}
  ansible.builtin.include_tasks: "{{ host_os }}.yml"

- name: Setup XDG configuration files
  become: false
  vars:
    xdg_secrets_dir: "{{ playbook_dir }}/.secrets/xdg_config"
    xdg_config_root: "{{ ansible_user_dir }}/.config"
  block:
    - name: Discover XDG secret config directories
      become: false
      ansible.builtin.find:
        paths: "{{ xdg_secrets_dir }}"
        file_type: directory
      register: xdg_secret_dirs

    - name: Ensure XDG config directories exist
      ansible.builtin.file:
        path: "{{ xdg_config_root }}/{{ item.path | basename }}"
        state: directory
        mode: "0700"
      loop: "{{ xdg_secret_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Deploy XDG configuration files
      ansible.builtin.copy:
        src: "{{ xdg_secrets_dir }}/{{ item.path | basename }}/"
        dest: "{{ xdg_config_root }}/{{ item.path | basename }}/"
        mode: "0600"
        directory_mode: "0700"
        force: "{{ xdg_config_force | bool }}"
      loop: "{{ xdg_secret_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      no_log: true
