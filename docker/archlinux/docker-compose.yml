name: ansible-arch
services:
  ansible:
    build:
      context: ../../
      dockerfile: docker/archlinux/Dockerfile
      args:
        TEST_USER: testuser
    image: ansible-arch-dev:latest
    container_name: ansible-arch-test
    volumes:
      - ../../:/ansible
    tmpfs:
      - /ansible/.secrets:uid=1000,gid=1000,mode=0700
    tty: true
    stdin_open: true
    environment:
      - ANSIBLE_FORCE_COLOR=1
