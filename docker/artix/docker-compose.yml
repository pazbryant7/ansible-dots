name: ansible-artix
services:
  ansible:
    build:
      context: ../../
      dockerfile: docker/artix/Dockerfile
      args:
        TEST_USER: testuser
    image: ansible-artix-dev:latest
    container_name: ansible-artix-test
    volumes:
      - ../../:/ansible
      - ../../.secrets:/ansible/.secrets:ro
    tty: true
    stdin_open: true
    environment:
      - ANSIBLE_FORCE_COLOR=1
