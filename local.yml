- name: Dotfiles config
  hosts: localhost
  connection: local
  vars:
    display_server: "xorg"
    repos_path: "{{ playbook_dir | dirname }}"
    dots_path: "{{ repos_path }}/dotfiles"

  pre_tasks:
    - name: Detect host system
      ansible.builtin.import_tasks: pre_tasks/whoami.yml
      tags: always

  tasks:
    - name: Run bootstrap roles (Always runs first)
      ansible.builtin.include_role:
        name: "{{ item }}"
        apply:
          tags: "{{ item }}"
      loop: "{{ bootstrap_roles }}"
      tags: always

    - name: Compute requested roles
      ansible.builtin.set_fact:
        cli_tags:
          "{{ ansible_run_tags | list | difference(['all', 'always']) }}"
      tags: always

    - name: Validate selected display role
      ansible.builtin.assert:
        that: display_server in display_server_roles
        fail_msg: >-
          Unsupported display_server '{{ display_server }}'. Supported values:
          {{ display_server_roles | join(', ') }}.
      tags: always

    - name: Validate requested roles
      ansible.builtin.assert:
        that: >-
          cli_tags | difference(
            bootstrap_roles + default_roles + display_server_roles
          ) | length == 0
        fail_msg: >-
          Unsupported role tag(s): {{ cli_tags | difference(bootstrap_roles +
          default_roles + display_server_roles) | join(', ') }}.
      when: cli_tags | length > 0
      tags: always

    - name: Compute target role execution list
      ansible.builtin.set_fact:
        target_roles: >-
          {{
            default_roles | select('in', cli_tags) | list
            if cli_tags | length > 0 else default_roles
          }}
      tags: always

    - name: Run target roles
      ansible.builtin.include_role:
        name: "{{ role_item }}"
        apply:
          tags: "{{ role_item }}"
      loop: >-
        {{ (target_roles + [display_server]) | unique }}
      loop_control:
        loop_var: role_item
      tags: always
