- name: Dotfiles config
  hosts: localhost
  connection: local
  vars:
    chosen_compositor: "xorg"
    dotfiles_dir: "{{ github_dir }}/dotfiles"
    xdg_config_dir: "{{ ansible_user_dir }}/.config"
    github_dir: "{{ ansible_user_dir }}/Documents/github"
  pre_tasks:
    - name: Detect host system
      ansible.builtin.import_tasks: pre_tasks/whoami.yml
      tags:
        - always

  tasks:
    - name: Run bootstrap roles
      ansible.builtin.include_role:
        name: "{{ item }}"
        apply:
          tags: "{{ item }}"
      loop: "{{ bootstrap_roles }}"
      tags:
        - always

    - name: Resolve chosen compositor
      ansible.builtin.set_fact:
        excluded_roles: >-
          {{ compositor_roles | difference([chosen_compositor]) | list }}
      tags:
        - always

    - name: Set roles to run
      ansible.builtin.set_fact:
        run_roles: >-
          {{
            (
              (
                ansible_run_tags | list | difference(['all', 'always'])
                if ansible_run_tags | list | difference(['all', 'always']) |
          length > 0
                else default_roles | list
              )
              + [chosen_compositor]
            )
            | difference(excluded_roles)
            | difference(bootstrap_roles)
            | sort
          }}
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        name: "{{ roles_item }}"
        apply:
          tags: "{{ roles_item }}"
      loop: "{{ run_roles }}"
      loop_control:
        loop_var: roles_item
      tags:
        - always
